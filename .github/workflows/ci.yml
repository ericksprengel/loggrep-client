name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: loggrep-client
    steps:
      - uses: actions/checkout@v4
        with:
          path: loggrep-client
      - uses: actions/checkout@v4
        with:
          repository: ericksprengel/loggrep
          ref: main
          path: loggrep
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
        working-directory: loggrep
      - run: bun install --frozen-lockfile
      - run: bun check
      - run: bun test
